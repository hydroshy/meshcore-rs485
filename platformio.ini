; PlatformIO Project Configuration File - Standalone RS485 Modbus Sensor
; Board: Seeed Studio XIAO ESP32C3 + Wio SX1262

[platformio]
default_envs = Xiao_C3_modbus_sensor

[env:Xiao_C3_modbus_sensor]
platform = platformio/espressif32@6.11.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
  SPI
  Wire
  https://github.com/jgromes/RadioLib.git#6d8934836678d8894e3d556550475b37dce3e2b6
  rweather/Crypto @ ^0.4.0
  adafruit/RTClib @ ^2.1.3
  melopero/Melopero RV3028 @ ^1.1.0
  electroniccats/CayenneLPP @ 1.6.1
  bakercp/CRC32 @ ^2.0.0

build_flags =
  -w
  -DNDEBUG
  -DRADIOLIB_STATIC_ONLY=1
  -DRADIOLIB_GODMODE=1
  -D ESP32
  -D ESP32_PLATFORM
  -D ESP32_CPU_FREQ=80
  ; LoRa radio configs
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D ENABLE_ADVERT_ON_BOOT=1
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; RadioLib optimizations
  -D RADIOLIB_EXCLUDE_CC1101=1
  -D RADIOLIB_EXCLUDE_RF69=1
  -D RADIOLIB_EXCLUDE_SX1231=1
  -D RADIOLIB_EXCLUDE_SI443X=1
  -D RADIOLIB_EXCLUDE_RFM2X=1
  -D RADIOLIB_EXCLUDE_SX128X=1
  -D RADIOLIB_EXCLUDE_AFSK=1
  -D RADIOLIB_EXCLUDE_AX25=1
  -D RADIOLIB_EXCLUDE_HELLSCHREIBER=1
  -D RADIOLIB_EXCLUDE_MORSE=1
  -D RADIOLIB_EXCLUDE_APRS=1
  -D RADIOLIB_EXCLUDE_BELL=1
  -D RADIOLIB_EXCLUDE_RTTY=1
  -D RADIOLIB_EXCLUDE_SSTV=1
  ; Xiao ESP32-C3 & Wio SX1262 pinout
  -D PIN_VBAT_READ=D0
  -D P_LORA_DIO_1=D1
  -D P_LORA_NSS=D4
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  ; Khong su dung D6/D7 cho I2C de danh rieng cho UART1 RS485
  -D PIN_BOARD_SDA=-1
  -D PIN_BOARD_SCL=-1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D SX126X_RXEN=D5
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  ; RS485 Modbus pins & parameters
  -D ADVERT_NAME='"XiaoC3 Modbus"'
  -D RS485_TX_PIN=21    ; D6 trên Xiao ESP32-C3
  -D RS485_RX_PIN=20    ; D7 trên Xiao ESP32-C3
  -D RS485_BAUD=9600
  -I src
  -I lib/MeshCore/src
  -I lib/MeshCore/src/helpers
  -I lib/ed25519
