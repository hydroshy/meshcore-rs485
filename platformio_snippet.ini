# Cấu hình môi trường cho PlatformIO
# Copy đoạn dưới đây vào cuối file MeshCore/variants/xiao_c3/platformio.ini

[env:Xiao_C3_modbus_sensor]
extends = Xiao_esp32_C3
build_src_filter = ${Xiao_esp32_C3.build_src_filter}
  +<../sensor/RS485_SENSOR/*.cpp>
build_flags =
  ${Xiao_esp32_C3.build_flags}
  ${sensor_base.build_flags}
  -I examples/simple_sensor
  -D ADVERT_NAME='"XiaoC3 Modbus"'
  -D RS485_TX_PIN=21    ; D6 trên Xiao ESP32-C3
  -D RS485_RX_PIN=20    ; D7 trên Xiao ESP32-C3
  -D RS485_BAUD=9600
lib_deps =
  ${Xiao_esp32_C3.lib_deps}
  ${sensor_base.lib_deps}
  ${esp32_ota.lib_deps}
  bakercp/CRC32 @ ^2.0.0
